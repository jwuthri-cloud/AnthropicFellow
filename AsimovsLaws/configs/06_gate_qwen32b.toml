# Probe-gated steering on Qwen3-32B-FP8, same pairs, n, seeds and batches as step 5 (whose baseline
# and always-on harm+8 are the references). The gate scores each generated token with the layer-48
# harm probe; it arms once the running mean (after 64 tokens) exceeds 0, which on step 3's
# timelines fires on 21% of benign traces, 95% of avoided-harm and 86% of picked-harm traces.
# "arm" steers from then on; "fade" steers only while the probe's EMA (span 50) is below 0.5.
output_dir = "outputs/v1/gate-qwen32b"
contrast = "data/contrast/harm_contrast.jsonl"
scenarios = "data/scenarios/pairs.jsonl"
samples = "outputs/v1/sample-qwen32b/samples.jsonl"
model = "Qwen/Qwen3-32B-FP8"
revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
layers = [48]
n = 4
batch_size = 24
max_new_tokens = 3584  # longest step-1 trace in these pairs: 3,045 tokens
temperature = 0.6
top_p = 0.95
top_k = 20
seed = 0

[[conditions]]
name = "gate-arm+8"
strength = 8.0
gate = "arm"

[[conditions]]
name = "gate-fade+8"
strength = 8.0
gate = "fade"

[[conditions]]
name = "gate-fade+16"
strength = 16.0
gate = "fade"
