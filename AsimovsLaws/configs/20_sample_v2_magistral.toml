# Cross-model check: Magistral-Small-2506 (Mistral, 24B, reasoning in <think> tags; Unsloth's
# HF-format copy, which ships a transformers tokenizer) on data/scenarios/pairs_v2.jsonl, 2 samples per row. Its chat
# template drops the reasoning instruction when a system prompt is given, so system_prefix restores
# Mistral's default reasoning system prompt ahead of each scenario's own. No API judge. (transformers
# warns about the tokenizer regex; with and without fix_mistral_regex, 400 scenario and contrast
# texts tokenize identically.)
output_dir = "outputs/v4/sample-v2-magistral"
scenarios = "data/scenarios/pairs_v2.jsonl"
system_prefix = "A user will ask you to solve a task. You should first draft your thinking process (inner monologue) until you have derived the final answer. Afterwards, write a self-contained summary of your thoughts (i.e. your summary should be succinct but contain all the critical steps you needed to reach the conclusion). You should use Markdown and Latex to format your response. Write both your thoughts and summary in the same language as the task posed by the user.\n\nYour thinking process must follow the template below:\n<think>\nYour thoughts or/and draft, like working through an exercise on scratch paper. Be as casual and as long as you want until you are confident to generate a correct answer.\n</think>\n\nHere, provide a concise summary that reflects your reasoning and presents a clear final answer to the user.\n\n"

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "unsloth/Magistral-Small-2506"
quantization = "fp8"  # dynamic FP8 for sampling, as with Qwen (the probe reads bf16): bf16 left
# KV room for only ~35 of Magistral's ~4,500-token traces at a time (~3 h for v2 alone)
revision = "c427df3663694fae7779e8fcac63dcde9dfe4013"
tokenizer_revision = "c427df3663694fae7779e8fcac63dcde9dfe4013"
max_model_len = 16384
gpu_memory_utilization = 0.92
seed = 0

[sampling.params]  # Mistral's recommended settings for Magistral
n = 2  # Magistral traces run ~6x Qwen's length; n = 2 keeps both sets in the 4 h stop
temperature = 0.7
top_p = 0.95
max_tokens = 12288
