# v2 stage 1: Qwen3-32B baseline on all 458 pairs of data/scenarios/pairs_v2.jsonl (10 harm
# categories), 4 samples per row. No API judge: answers and reasoning are judged in-session.
output_dir = "outputs/v3/sample-v2-qwen32b"
scenarios = "data/scenarios/pairs_v2.jsonl"

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "Qwen/Qwen3-32B-FP8"
revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
tokenizer_revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
max_model_len = 8192
gpu_memory_utilization = 0.92
seed = 0

[sampling.params]
n = 4
temperature = 0.6
top_p = 0.95
top_k = 20
max_tokens = 6144
