# Steering on Qwen3-32B (FP8, the checkpoint step 1 sampled with; bf16 OOMed at batch 16 and ran
# ~6 min per batch): add the harm-minus-safe mean-difference vector at decoder output 48
# (step 2's best probe layer) to every generated token, on the 17 pairs step 1 saw picked, n=4.
# Strengths are multiples of the raw mean-difference vector; the log prints its norm relative to
# the mean residual norm. A strength that breaks the format shows up as a lower ACTION-line rate.
output_dir = "outputs/v1/steer-qwen32b"
contrast = "data/contrast/harm_contrast.jsonl"
scenarios = "data/scenarios/pairs.jsonl"
samples = "outputs/v1/sample-qwen32b/samples.jsonl"
model = "Qwen/Qwen3-32B-FP8"
revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
layers = [48]
n = 4
batch_size = 24
max_new_tokens = 3584  # longest step-1 trace in these pairs: 3,045 tokens
temperature = 0.6
top_p = 0.95
top_k = 20
seed = 0

[[conditions]]
name = "baseline"
strength = 0.0

[[conditions]]
name = "harm+8"
strength = 8.0

[[conditions]]
name = "harm+16"
strength = 16.0

[[conditions]]
name = "harm-8"
strength = -8.0

[[conditions]]
name = "random+16"
strength = 16.0
random = true
