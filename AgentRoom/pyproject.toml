[project]
name = "agentroom"
version = "0.1.0"
description = "Host discussions between AI agents (Codex, Claude, OpenRouter models) about a research repository, from an MCP server or a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27",
]

[project.optional-dependencies]
# deepagents seats that call API models through OpenRouter (paid per token).
openrouter = [
    "deepagents>=0.7",
    "langchain-openrouter>=0.1",
]

[project.scripts]
agentroom = "agentroom.cli:app"
agentroom-mcp = "agentroom.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
